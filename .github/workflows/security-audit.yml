name: Security Audit
on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm install
      - name: Run security scan
        run: node scripts/security-scan.js
      - name: Run npm audit gate
        run: npm run security:gate

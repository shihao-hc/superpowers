# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'opencode'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenCode Application
  - job_name: 'opencode'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
    scrape_interval: 60s

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Recording Rules
recording_rules:
  - name: 'opencode_requests'
    rules:
      - record: 'rate:opencode_requests_total:rate5m'
        expr: 'rate(opencode_requests_total[5m])'
      - record: 'rate:opencode_errors_total:rate5m'
        expr: 'rate(opencode_errors_total[5m])'

  - name: 'opencode_latency'
    rules:
      - record: 'histogram_quantile:opencode_request_duration_seconds:95p'
        expr: 'histogram_quantile(0.95, rate(opencode_request_duration_seconds_bucket[5m]))'
      - record: 'histogram_quantile:opencode_request_duration_seconds:99p'
        expr: 'histogram_quantile(0.99, rate(opencode_request_duration_seconds_bucket[5m]))'
